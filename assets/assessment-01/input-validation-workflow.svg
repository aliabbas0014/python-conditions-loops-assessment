<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 520" width="1140" height="520">

  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="softBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="softPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111318" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <style>
      .title-main { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111318; }
      .title-sub { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; letter-spacing: 0.4px; }
      .box-title { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #111318; }
      .box-text { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
      .box-code { font-family: 'Consolas', 'Fira Code', monospace; font-size: 11.5px; font-weight: 600; fill: #172554; }
      .label-badge { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .edge-label { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .footer-note { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
    </style>
  </defs>


  <rect x="0" y="0" width="1140" height="520" fill="#F8FAFC"/>
  <rect x="16" y="16" width="1108" height="488" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="16" y="16" width="1108" height="6" rx="3" fill="url(#headerGrad)"/>
  <rect x="36" y="34" width="126" height="24" rx="12" fill="url(#bpGrad)"/>
  <text x="99" y="50" text-anchor="middle" class="label-badge">COMMON • INPUT VALIDATION</text>
  <text x="176" y="54" class="title-main">Input Validation Workflow</text>
  <text x="36" y="77" class="title-sub">How valid and invalid user inputs are handled across both Python applications</text>
  <line x1="36" y1="90" x2="1104" y2="90" stroke="#E2E8F0" stroke-width="1.5"/>


  <!-- User Input -->
  <rect x="440" y="106" width="260" height="44" rx="8" fill="url(#softBlueGrad)" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="570" y="125" text-anchor="middle" class="box-title">User Enters Input Value</text>
  <text x="570" y="142" text-anchor="middle" class="box-text">Marks, attendance, income, stock, price, qty</text>
  <line x1="570" y1="150" x2="570" y2="176" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Validation Diamond -->
  <polygon points="570,180 755,228 570,276 385,228" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="570" y="224" text-anchor="middle" class="box-title">Is Input Valid &amp; Within Bounds?</text>
  <text x="570" y="242" text-anchor="middle" class="box-text">Type, non-negative, range &amp; stock limits</text>

  <!-- Invalid Branch (Left) -->
  <line x1="385" y1="228" x2="265" y2="228" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="325" y="219" text-anchor="middle" class="edge-label" fill="#DC2626">Invalid Input</text>

  <rect x="46" y="182" width="215" height="248" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="46" y="182" width="215" height="32" rx="10" fill="#DC2626"/>
  <text x="153" y="203" text-anchor="middle" class="label-badge">INVALID INPUT HANDLING</text>
  <text x="60" y="234" class="box-title" fill="#991B1B">Examples of Invalid Data:</text>
  <text x="60" y="256" class="box-text">• Marks &lt; 0 or &gt; 100</text>
  <text x="60" y="276" class="box-text">• Attendance &lt; 0 or &gt; 100</text>
  <text x="60" y="296" class="box-text">• Negative income or price</text>
  <text x="60" y="316" class="box-text">• Sold qty &gt; available stock</text>
  <rect x="60" y="334" width="187" height="82" rx="6" fill="#FFFFFF" stroke="#FECACA"/>
  <text x="153" y="356" text-anchor="middle" class="box-title" fill="#991B1B">System Response:</text>
  <text x="153" y="376" text-anchor="middle" class="box-text">Display clear error/warning</text>
  <text x="153" y="396" text-anchor="middle" class="box-text">Do not corrupt totals/stock</text>

  <!-- Valid Branch (Right) -->
  <line x1="755" y1="228" x2="875" y2="228" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="815" y="219" text-anchor="middle" class="edge-label" fill="#1E293B">Valid Input</text>

  <rect x="879" y="182" width="215" height="248" rx="10" fill="url(#softBlueGrad)" stroke="#3B82F6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="879" y="182" width="215" height="32" rx="10" fill="#2563EB"/>
  <text x="986" y="203" text-anchor="middle" class="label-badge">VALID INPUT HANDLING</text>
  <text x="893" y="234" class="box-title">Accepted Constraints:</text>
  <text x="893" y="256" class="box-text">• Marks: 0.0 – 100.0%</text>
  <text x="893" y="276" class="box-text">• Attendance: 0.0 – 100.0%</text>
  <text x="893" y="296" class="box-text">• Income &amp; price &gt;= 0</text>
  <text x="893" y="316" class="box-text">• 0 &lt;= qty_sold &lt;= stock</text>
  <rect x="893" y="334" width="187" height="82" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="986" y="356" text-anchor="middle" class="box-title">System Response:</text>
  <text x="986" y="376" text-anchor="middle" class="box-text">Evaluate eligibility or compute</text>
  <text x="986" y="396" text-anchor="middle" class="box-text">sale, stock &amp; accumulators</text>

  <!-- Bottom Down Arrow -->
  <line x1="570" y1="276" x2="570" y2="444" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <rect x="330" y="446" width="480" height="28" rx="6" fill="url(#softPurpleGrad)" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="570" y="465" text-anchor="middle" class="box-code">Deterministic, Safe Program Execution &amp; Clear Feedback</text>


  <line x1="36" y1="482" x2="1104" y2="482" stroke="#E2E8F0" stroke-width="1"/>
  <text x="36" y="500" class="footer-note">Python Programming Assessment – Conditions &amp; Loops • Task 01 &amp; Task 02</text>
  <text x="1104" y="500" text-anchor="end" class="footer-note">aliabbas0014/python-conditions-loops-assessment</text>

</svg>
