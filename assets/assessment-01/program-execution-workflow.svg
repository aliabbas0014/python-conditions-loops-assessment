<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 510" width="1160" height="510">

  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="softBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="softPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111318" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <style>
      .title-main { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111318; }
      .title-sub { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; letter-spacing: 0.4px; }
      .box-title { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #111318; }
      .box-text { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
      .box-code { font-family: 'Consolas', 'Fira Code', monospace; font-size: 11.5px; font-weight: 600; fill: #172554; }
      .label-badge { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .edge-label { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .footer-note { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
    </style>
  </defs>


  <rect x="0" y="0" width="1160" height="510" fill="#F8FAFC"/>
  <rect x="16" y="16" width="1128" height="478" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="16" y="16" width="1128" height="6" rx="3" fill="url(#headerGrad)"/>
  <rect x="36" y="34" width="126" height="24" rx="12" fill="url(#bpGrad)"/>
  <text x="99" y="50" text-anchor="middle" class="label-badge">COMMON • EXECUTION FLOW</text>
  <text x="176" y="54" class="title-main">Program Execution Workflow</text>
  <text x="36" y="77" class="title-sub">Runtime execution flow for both Python applications from startup to final output</text>
  <line x1="36" y1="90" x2="1124" y2="90" stroke="#E2E8F0" stroke-width="1.5"/>


  <!-- Lane Labels -->
  <rect x="36" y="112" width="170" height="150" rx="10" fill="url(#softBlueGrad)" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="121" y="180" text-anchor="middle" class="box-title" fill="#1E40AF">Task 01</text>
  <text x="121" y="200" text-anchor="middle" class="box-text">Scholarship</text>
  <text x="121" y="218" text-anchor="middle" class="box-text">Eligibility</text>

  <rect x="36" y="286" width="170" height="150" rx="10" fill="url(#softPurpleGrad)" stroke="#8B5CF6" stroke-width="1.8"/>
  <text x="121" y="354" text-anchor="middle" class="box-title" fill="#5B21B6">Task 02</text>
  <text x="121" y="374" text-anchor="middle" class="box-text">Pharmacy</text>
  <text x="121" y="392" text-anchor="middle" class="box-text">Inventory &amp; Sales</text>

  <!-- Task 01 Steps -->
  <rect x="234" y="128" width="195" height="118" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6" filter="url(#cardShadow)"/>
  <text x="331" y="152" text-anchor="middle" class="box-title">1. Start &amp; Input</text>
  <text x="248" y="176" class="box-text">• Launch scholarship script</text>
  <text x="248" y="196" class="box-text">• Read marks, attendance</text>
  <text x="248" y="216" class="box-text">• Read monthly income</text>
  <text x="248" y="236" class="box-text">• Validate input ranges</text>

  <line x1="429" y1="187" x2="461" y2="187" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="465" y="128" width="215" height="118" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6" filter="url(#cardShadow)"/>
  <text x="572" y="152" text-anchor="middle" class="box-title">2. Conditional Logic</text>
  <text x="479" y="176" class="box-text">• Check &gt;=80%, &gt;=85%, &lt;=50k</text>
  <text x="479" y="196" class="box-text">• Branch to Full (&gt;=90%)</text>
  <text x="479" y="216" class="box-text">• Branch to Partial (80–89%)</text>
  <text x="479" y="236" class="box-text">• Or capture Ineligible reason</text>

  <line x1="680" y1="187" x2="712" y2="187" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="716" y="128" width="408" height="118" rx="8" fill="url(#softBlueGrad)" stroke="#3B82F6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="920" y="152" text-anchor="middle" class="box-title">3. Final Scholarship Output</text>
  <text x="732" y="178" class="box-text">• Prints formatted student evaluation summary</text>
  <text x="732" y="200" class="box-text">• Displays Full Scholarship, Partial Scholarship, or Ineligible reason</text>
  <text x="732" y="222" class="box-code">Program terminates cleanly after single evaluation</text>

  <!-- Task 02 Steps -->
  <rect x="234" y="302" width="195" height="118" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.6" filter="url(#cardShadow)"/>
  <text x="331" y="326" text-anchor="middle" class="box-title">1. Init &amp; Loop Start</text>
  <text x="248" y="350" class="box-text">• total_revenue = 0</text>
  <text x="248" y="370" class="box-text">• restock_count = 0</text>
  <text x="248" y="390" class="box-text">• Read medicine count</text>
  <text x="248" y="410" class="box-text">• Enter for-loop iteration</text>

  <line x1="429" y1="361" x2="461" y2="361" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <rect x="465" y="302" width="215" height="118" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.6" filter="url(#cardShadow)"/>
  <text x="572" y="326" text-anchor="middle" class="box-title">2. Loop Body &amp; Updates</text>
  <text x="479" y="350" class="box-text">• Validate stock vs. qty_sold</text>
  <text x="479" y="370" class="box-text">• Compute sale &amp; remaining stock</text>
  <text x="479" y="390" class="box-text">• Update revenue accumulator</text>
  <text x="479" y="410" class="box-text">• Check &lt;10 &amp; restock counter</text>

  <line x1="680" y1="361" x2="712" y2="361" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <rect x="716" y="302" width="408" height="118" rx="8" fill="url(#softPurpleGrad)" stroke="#8B5CF6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="920" y="326" text-anchor="middle" class="box-title">3. Final Pharmacy Sales Report</text>
  <text x="732" y="352" class="box-text">• Exits for-loop once all medicines are processed</text>
  <text x="732" y="374" class="box-text">• Prints total daily revenue, restock count &amp; low-stock alerts</text>
  <text x="732" y="396" class="box-code">Displays complete pharmacy summary report</text>


  <line x1="36" y1="472" x2="1124" y2="472" stroke="#E2E8F0" stroke-width="1"/>
  <text x="36" y="490" class="footer-note">Python Programming Assessment – Conditions &amp; Loops • Task 01 &amp; Task 02</text>
  <text x="1124" y="490" text-anchor="end" class="footer-note">aliabbas0014/python-conditions-loops-assessment</text>

</svg>
