<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760">

  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="softBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="softPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111318" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <style>
      .title-main { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111318; }
      .title-sub { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; letter-spacing: 0.4px; }
      .box-title { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #111318; }
      .box-text { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
      .box-code { font-family: 'Consolas', 'Fira Code', monospace; font-size: 11.5px; font-weight: 600; fill: #172554; }
      .label-badge { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .edge-label { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .footer-note { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
    </style>
  </defs>


  <rect x="0" y="0" width="1120" height="760" fill="#F8FAFC"/>
  <rect x="16" y="16" width="1088" height="728" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="16" y="16" width="1088" height="6" rx="3" fill="url(#headerGrad)"/>
  <rect x="36" y="34" width="126" height="24" rx="12" fill="url(#bpGrad)"/>
  <text x="99" y="50" text-anchor="middle" class="label-badge">TASK 01 • FLOWCHART</text>
  <text x="176" y="54" class="title-main">Scholarship System — Complete Flowchart</text>
  <text x="36" y="77" class="title-sub">End-to-end decision flow from student input through all three eligibility rules to final status</text>
  <line x1="36" y1="90" x2="1084" y2="90" stroke="#E2E8F0" stroke-width="1.5"/>


  <!-- Start -->
  <rect x="440" y="106" width="200" height="40" rx="20" fill="#172554"/>
  <text x="540" y="131" text-anchor="middle" class="label-badge">START EVALUATION</text>
  <line x1="540" y1="146" x2="540" y2="174" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Input Box -->
  <rect x="370" y="178" width="340" height="54" rx="8" fill="url(#softBlueGrad)" stroke="#3B82F6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="540" y="201" text-anchor="middle" class="box-title">Collect Student Inputs</text>
  <text x="540" y="220" text-anchor="middle" class="box-text">Marks (%), Attendance (%), Monthly Income (Rs.)</text>
  <line x1="540" y1="232" x2="540" y2="256" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Diamond 1: Marks >= 80% -->
  <polygon points="540,260 695,305 540,350 385,305" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="540" y="302" text-anchor="middle" class="box-title">Marks &gt;= 80%?</text>
  <text x="540" y="319" text-anchor="middle" class="box-text">Academic threshold</text>

  <!-- Marks No -> Ineligible -->
  <line x1="695" y1="305" x2="820" y2="305" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="752" y="297" text-anchor="middle" class="edge-label" fill="#DC2626">No (&lt; 80%)</text>

  <!-- Marks Yes -> Diamond 2: Attendance >= 85% -->
  <line x1="540" y1="350" x2="540" y2="384" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="568" y="371" class="edge-label">Yes</text>

  <polygon points="540,388 695,433 540,478 385,433" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="540" y="430" text-anchor="middle" class="box-title">Attendance &gt;= 85%?</text>
  <text x="540" y="447" text-anchor="middle" class="box-text">Minimum attendance rule</text>

  <!-- Attendance No -> Ineligible -->
  <line x1="695" y1="433" x2="820" y2="433" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="756" y="425" text-anchor="middle" class="edge-label" fill="#DC2626">No (&lt; 85%)</text>

  <!-- Attendance Yes -> Diamond 3: Income <= 50000 -->
  <line x1="540" y1="478" x2="540" y2="512" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="568" y="499" class="edge-label">Yes</text>

  <polygon points="540,516 705,561 540,606 375,561" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="540" y="558" text-anchor="middle" class="box-title">Income &lt;= Rs. 50,000?</text>
  <text x="540" y="575" text-anchor="middle" class="box-text">Monthly family income cap</text>

  <!-- Income No -> Ineligible -->
  <line x1="705" y1="561" x2="820" y2="561" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="762" y="553" text-anchor="middle" class="edge-label" fill="#DC2626">No (&gt; 50k)</text>

  <!-- Ineligible Box on Right -->
  <rect x="824" y="278" width="250" height="310" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="824" y="278" width="250" height="34" rx="10" fill="#DC2626"/>
  <text x="949" y="300" text-anchor="middle" class="label-badge">INELIGIBLE PATH</text>
  <text x="949" y="336" text-anchor="middle" class="box-title">Not Eligible for Award</text>
  <text x="840" y="364" class="box-text">Displays specific reason(s):</text>
  <text x="840" y="390" class="box-text">• Academic marks below 80%</text>
  <text x="840" y="414" class="box-text">• Attendance below 85%</text>
  <text x="840" y="438" class="box-text">• Income above Rs. 50,000</text>
  <rect x="842" y="465" width="214" height="104" rx="8" fill="#FFFFFF" stroke="#FECACA"/>
  <text x="949" y="490" text-anchor="middle" class="box-code">status = "Ineligible"</text>
  <text x="949" y="514" text-anchor="middle" class="box-text">Shows unmet criteria clearly</text>
  <text x="949" y="536" text-anchor="middle" class="box-text">to guide student eligibility</text>

  <!-- Income Yes -> Diamond 4: Marks >= 90% -->
  <line x1="540" y1="606" x2="540" y2="634" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="568" y="624" class="edge-label">Yes</text>

  <!-- Split into Full vs Partial Scholarship -->
  <rect x="70" y="636" width="320" height="68" rx="10" fill="url(#bpGrad)" filter="url(#cardShadow)"/>
  <text x="230" y="663" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">FULL SCHOLARSHIP (Marks &gt;= 90%)</text>
  <text x="230" y="685" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#EFF6FF">All criteria met + distinction marks (90–100%)</text>

  <rect x="430" y="636" width="320" height="68" rx="10" fill="url(#softPurpleGrad)" stroke="#8B5CF6" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="590" y="663" text-anchor="middle" class="box-title">PARTIAL SCHOLARSHIP (80%–89%)</text>
  <text x="590" y="685" text-anchor="middle" class="box-text">All criteria met + marks between 80% and 89%</text>

  <!-- Arrows from Diamond 3 to Full &amp; Partial -->
  <path d="M 455 583 L 230 583 L 230 632" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="325" y="576" text-anchor="middle" class="edge-label">Marks &gt;= 90%</text>

  <path d="M 540 606 L 590 606 L 590 632" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="632" y="624" class="edge-label">80%–89%</text>

  <!-- Arrow from Ineligible to Report -->
  <path d="M 949 588 L 949 670 L 790 670" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <text x="949" y="655" text-anchor="middle" class="edge-label" fill="#DC2626">Print Report &amp; End</text>


  <line x1="36" y1="722" x2="1084" y2="722" stroke="#E2E8F0" stroke-width="1"/>
  <text x="36" y="740" class="footer-note">Python Programming Assessment – Conditions &amp; Loops • Task 01 &amp; Task 02</text>
  <text x="1084" y="740" text-anchor="end" class="footer-note">aliabbas0014/python-conditions-loops-assessment</text>

</svg>
