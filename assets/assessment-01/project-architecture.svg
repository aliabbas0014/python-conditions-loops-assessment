  <text x="179" y="302" text-anchor="middle" class="box-text">Marks, Attendance, Income</text>

  <rect x="326" y="260" width="210" height="54" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="431" y="283" text-anchor="middle" class="box-title">2. Rule Evaluation</text>
  <text x="431" y="302" text-anchor="middle" class="box-text">&gt;=80%, &gt;=85%, &lt;=Rs.50,000</text>

  <rect x="74" y="332" width="210" height="54" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
