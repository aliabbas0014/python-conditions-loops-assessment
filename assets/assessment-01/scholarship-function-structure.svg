<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560">

  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="softBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="softPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111318" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <style>
      .title-main { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111318; }
      .title-sub { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; letter-spacing: 0.4px; }
      .box-title { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #111318; }
      .box-text { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
      .box-code { font-family: 'Consolas', 'Fira Code', monospace; font-size: 11.5px; font-weight: 600; fill: #172554; }
      .label-badge { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .edge-label { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .footer-note { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
    </style>
  </defs>


  <rect x="0" y="0" width="1160" height="560" fill="#F8FAFC"/>
  <rect x="16" y="16" width="1128" height="528" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="16" y="16" width="1128" height="6" rx="3" fill="url(#headerGrad)"/>
  <rect x="36" y="34" width="126" height="24" rx="12" fill="url(#bpGrad)"/>
  <text x="99" y="50" text-anchor="middle" class="label-badge">TASK 01 • STRUCTURE</text>
  <text x="176" y="54" class="title-main">Scholarship System — Functional Structure</text>
  <text x="36" y="77" class="title-sub">Logical modules and processing stages for Task 01: Student Scholarship Eligibility System</text>
  <line x1="36" y1="90" x2="1124" y2="90" stroke="#E2E8F0" stroke-width="1.5"/>


  <!-- Top Controller Block -->
  <rect x="380" y="112" width="400" height="58" rx="10" fill="url(#bpGrad)" filter="url(#cardShadow)"/>
  <text x="580" y="137" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Scholarship Eligibility Program (main)</text>
  <text x="580" y="157" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#EFF6FF">Orchestrates sequential evaluation &amp; summary output</text>

  <!-- Connector lines from main to 5 modules -->
  <line x1="580" y1="170" x2="580" y2="205" stroke="#3B82F6" stroke-width="2"/>
  <line x1="140" y1="205" x2="1020" y2="205" stroke="#3B82F6" stroke-width="2"/>
  <line x1="140" y1="205" x2="140" y2="232" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="360" y1="205" x2="360" y2="232" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="580" y1="205" x2="580" y2="232" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="800" y1="205" x2="800" y2="232" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="1020" y1="205" x2="1020" y2="232" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- 5 Functional Cards -->
  <!-- Card 1 -->
  <rect x="42" y="236" width="196" height="225" rx="10" fill="url(#softBlueGrad)" stroke="#3B82F6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="42" y="236" width="196" height="34" rx="10" fill="#3B82F6"/>
  <text x="140" y="258" text-anchor="middle" class="label-badge">1. INPUT COLLECTION</text>
  <text x="140" y="294" text-anchor="middle" class="box-title">Collect Student Data</text>
  <text x="56" y="320" class="box-text">• Academic marks (%)</text>
  <text x="56" y="342" class="box-text">• Attendance (%)</text>
  <text x="56" y="364" class="box-text">• Monthly income (Rs.)</text>
  <rect x="56" y="386" width="168" height="56" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="140" y="408" text-anchor="middle" class="box-code">marks, attendance,</text>
  <text x="140" y="426" text-anchor="middle" class="box-code">monthly_income</text>

  <!-- Card 2 -->
  <rect x="262" y="236" width="196" height="225" rx="10" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="262" y="236" width="196" height="34" rx="10" fill="#2563EB"/>
  <text x="360" y="258" text-anchor="middle" class="label-badge">2. VALIDATION</text>
  <text x="360" y="294" text-anchor="middle" class="box-title">Validate Input Ranges</text>
  <text x="276" y="320" class="box-text">• Numeric type check</text>
  <text x="276" y="342" class="box-text">• Marks &amp; att.: 0–100%</text>
  <text x="276" y="364" class="box-text">• Income: non-negative</text>
  <rect x="276" y="386" width="168" height="56" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="360" y="408" text-anchor="middle" class="box-code">Reject invalid or</text>
  <text x="360" y="426" text-anchor="middle" class="box-code">out-of-range values</text>

  <!-- Card 3 -->
  <rect x="482" y="236" width="196" height="225" rx="10" fill="url(#softPurpleGrad)" stroke="#8B5CF6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="482" y="236" width="196" height="34" rx="10" fill="#7C3AED"/>
  <text x="580" y="258" text-anchor="middle" class="label-badge">3. ELIGIBILITY CHECK</text>
  <text x="580" y="294" text-anchor="middle" class="box-title">Verify Base Criteria</text>
  <text x="496" y="320" class="box-text">• Marks &gt;= 80%</text>
  <text x="496" y="342" class="box-text">• Attendance &gt;= 85%</text>
  <text x="496" y="364" class="box-text">• Income &lt;= Rs. 50,000</text>
  <rect x="496" y="386" width="168" height="56" rx="6" fill="#FFFFFF" stroke="#DDD6FE"/>
  <text x="580" y="408" text-anchor="middle" class="box-code">if / elif / else</text>
  <text x="580" y="426" text-anchor="middle" class="box-code">eligibility gates</text>

  <!-- Card 4 -->
  <rect x="702" y="236" width="196" height="225" rx="10" fill="url(#softBlueGrad)" stroke="#3B82F6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="702" y="236" width="196" height="34" rx="10" fill="#4F46E5"/>
  <text x="800" y="258" text-anchor="middle" class="label-badge">4. CLASSIFICATION</text>
  <text x="800" y="294" text-anchor="middle" class="box-title">Determine Tier / Reason</text>
  <text x="716" y="320" class="box-text">• &gt;= 90%: Full Award</text>
  <text x="716" y="342" class="box-text">• 80–89%: Partial Award</text>
  <text x="716" y="364" class="box-text">• Else: Ineligible reason</text>
  <rect x="716" y="386" width="168" height="56" rx="6" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="800" y="408" text-anchor="middle" class="box-code">Full | Partial |</text>
  <text x="800" y="426" text-anchor="middle" class="box-code">Ineligible status</text>

  <!-- Card 5 -->
  <rect x="922" y="236" width="196" height="225" rx="10" fill="url(#softPurpleGrad)" stroke="#A78BFA" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="922" y="236" width="196" height="34" rx="10" fill="#8B5CF6"/>
  <text x="1020" y="258" text-anchor="middle" class="label-badge">5. REPORT OUTPUT</text>
  <text x="1020" y="294" text-anchor="middle" class="box-title">Generate Result Report</text>
  <text x="936" y="320" class="box-text">• Student metrics echo</text>
  <text x="936" y="342" class="box-text">• Scholarship verdict</text>
  <text x="936" y="364" class="box-text">• Actionable feedback</text>
  <rect x="936" y="386" width="168" height="56" rx="6" fill="#FFFFFF" stroke="#E9D5FF"/>
  <text x="1020" y="408" text-anchor="middle" class="box-code">Formatted console</text>
  <text x="1020" y="426" text-anchor="middle" class="box-code">eligibility summary</text>

  <!-- Horizontal pipeline arrow hint -->
  <text x="580" y="492" text-anchor="middle" class="box-text">Pipeline Flow:  Input Collection  →  Validation  →  Eligibility Check  →  Scholarship Classification  →  Report Generation</text>


  <line x1="36" y1="522" x2="1124" y2="522" stroke="#E2E8F0" stroke-width="1"/>
  <text x="36" y="540" class="footer-note">Python Programming Assessment – Conditions &amp; Loops • Task 01 &amp; Task 02</text>
  <text x="1124" y="540" text-anchor="end" class="footer-note">aliabbas0014/python-conditions-loops-assessment</text>

</svg>
