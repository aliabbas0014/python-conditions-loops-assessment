<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560">

  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="softBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="softPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111318" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <style>
      .title-main { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111318; }
      .title-sub { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; letter-spacing: 0.4px; }
      .box-title { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #111318; }
      .box-text { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
      .box-code { font-family: 'Consolas', 'Fira Code', monospace; font-size: 11.5px; font-weight: 600; fill: #172554; }
      .label-badge { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .edge-label { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .footer-note { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
    </style>
  </defs>


  <rect x="0" y="0" width="1160" height="560" fill="#F8FAFC"/>
  <rect x="16" y="16" width="1128" height="528" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="16" y="16" width="1128" height="6" rx="3" fill="url(#headerGrad)"/>
  <rect x="36" y="34" width="126" height="24" rx="12" fill="url(#bpGrad)"/>
  <text x="99" y="50" text-anchor="middle" class="label-badge">CONCEPTS • OVERVIEW</text>
  <text x="176" y="54" class="title-main">Core Python Concepts Demonstrated</text>
  <text x="36" y="77" class="title-sub">Visual guide to all 8 core programming concepts applied in Assessment 01</text>
  <line x1="36" y1="90" x2="1124" y2="90" stroke="#E2E8F0" stroke-width="1.5"/>


  <!-- 4x2 Grid of 8 Concept Cards -->
  <!-- 1. if, elif, else -->
  <rect x="44" y="114" width="256" height="175" rx="10" fill="url(#softBlueGrad)" stroke="#3B82F6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="172" y="142" text-anchor="middle" class="box-title">if, elif, else</text>
  <text x="58" y="166" class="box-text">Multi-branch decision making for</text>
  <text x="58" y="184" class="box-text">scholarship tiers, eligibility rules,</text>
  <text x="58" y="202" class="box-text">and low-stock conditions.</text>
  <rect x="58" y="218" width="228" height="54" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="172" y="241" text-anchor="middle" class="box-code">if marks &gt;= 90: ...</text>
  <text x="172" y="260" text-anchor="middle" class="box-code">elif marks &gt;= 80: ...</text>

  <!-- 2. for loop -->
  <rect x="322" y="114" width="256" height="175" rx="10" fill="url(#softPurpleGrad)" stroke="#8B5CF6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="450" y="142" text-anchor="middle" class="box-title">for loop</text>
  <text x="336" y="166" class="box-text">Iterates repeatedly through a</text>
  <text x="336" y="184" class="box-text">defined sequence of medicines</text>
  <text x="336" y="202" class="box-text">in the pharmacy sales system.</text>
  <rect x="336" y="218" width="228" height="54" rx="6" fill="#FFFFFF" stroke="#DDD6FE"/>
  <text x="450" y="241" text-anchor="middle" class="box-code">for i in range(n):</text>
  <text x="450" y="260" text-anchor="middle" class="box-code">  # process medicine</text>

  <!-- 3. range() -->
  <rect x="600" y="114" width="256" height="175" rx="10" fill="url(#softBlueGrad)" stroke="#3B82F6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="728" y="142" text-anchor="middle" class="box-title">range()</text>
  <text x="614" y="166" class="box-text">Generates numeric index sequences</text>
  <text x="614" y="184" class="box-text">to control exact iteration counts</text>
  <text x="614" y="202" class="box-text">when collecting medicine items.</text>
  <rect x="614" y="218" width="228" height="54" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="728" y="241" text-anchor="middle" class="box-code">range(num_medicines)</text>
  <text x="728" y="260" text-anchor="middle" class="box-code">0, 1, 2, ... n-1</text>

  <!-- 4. Conditions inside loops -->
  <rect x="878" y="114" width="238" height="175" rx="10" fill="url(#softPurpleGrad)" stroke="#8B5CF6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="997" y="142" text-anchor="middle" class="box-title">Conditions Inside Loops</text>
  <text x="892" y="166" class="box-text">Checks stock sufficiency and</text>
  <text x="892" y="184" class="box-text">low-stock thresholds (&lt; 10)</text>
  <text x="892" y="202" class="box-text">during each medicine pass.</text>
  <rect x="892" y="218" width="210" height="54" rx="6" fill="#FFFFFF" stroke="#DDD6FE"/>
  <text x="997" y="241" text-anchor="middle" class="box-code">if qty &lt;= stock:</text>
  <text x="997" y="260" text-anchor="middle" class="box-code">  if rem &lt; 10: warn()</text>

  <!-- 5. Counters -->
  <rect x="44" y="312" width="256" height="175" rx="10" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="172" y="340" text-anchor="middle" class="box-title">Counters</text>
  <text x="58" y="364" class="box-text">Tracks discrete occurrences such</text>
  <text x="58" y="382" class="box-text">as how many medicines require</text>
  <text x="58" y="400" class="box-text">restocking (&lt; 10 remaining).</text>
  <rect x="58" y="416" width="228" height="54" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="172" y="439" text-anchor="middle" class="box-code">restock_count = 0</text>
  <text x="172" y="458" text-anchor="middle" class="box-code">restock_count += 1</text>

  <!-- 6. Accumulators -->
  <rect x="322" y="312" width="256" height="175" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="450" y="340" text-anchor="middle" class="box-title">Accumulators</text>
  <text x="336" y="364" class="box-text">Aggregates running totals across</text>
  <text x="336" y="382" class="box-text">iterations, such as cumulative</text>
  <text x="336" y="400" class="box-text">daily pharmacy sales revenue.</text>
  <rect x="336" y="416" width="228" height="54" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="450" y="439" text-anchor="middle" class="box-code">total_revenue = 0.0</text>
  <text x="450" y="458" text-anchor="middle" class="box-code">total_revenue += sale</text>

  <!-- 7. Input Validation -->
  <rect x="600" y="312" width="256" height="175" rx="10" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="728" y="340" text-anchor="middle" class="box-title">Input Validation</text>
  <text x="614" y="364" class="box-text">Safeguards program logic against</text>
  <text x="614" y="382" class="box-text">out-of-range percentages, negative</text>
  <text x="614" y="400" class="box-text">values, or excess sales quantities.</text>
  <rect x="614" y="416" width="228" height="54" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="728" y="439" text-anchor="middle" class="box-code">0 &lt;= marks &lt;= 100</text>
  <text x="728" y="458" text-anchor="middle" class="box-code">qty_sold &lt;= stock</text>

  <!-- 8. Variables &amp; Arithmetic -->
  <rect x="878" y="312" width="238" height="175" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="997" y="340" text-anchor="middle" class="box-title">Variables &amp; Arithmetic</text>
  <text x="892" y="364" class="box-text">Stores domain values and computes</text>
  <text x="892" y="382" class="box-text">sales amounts and remaining stock</text>
  <text x="892" y="400" class="box-text">using multiplication &amp; subtraction.</text>
  <rect x="892" y="416" width="210" height="54" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="997" y="439" text-anchor="middle" class="box-code">sale = price * qty</text>
  <text x="997" y="458" text-anchor="middle" class="box-code">rem = stock - qty</text>


  <line x1="36" y1="522" x2="1124" y2="522" stroke="#E2E8F0" stroke-width="1"/>
  <text x="36" y="540" class="footer-note">Python Programming Assessment – Conditions &amp; Loops • Task 01 &amp; Task 02</text>
  <text x="1124" y="540" text-anchor="end" class="footer-note">aliabbas0014/python-conditions-loops-assessment</text>

</svg>
