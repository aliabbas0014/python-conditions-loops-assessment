<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="55%" stop-color="#141928"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="footWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="footGlow" cx="85%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#111318" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="190" fill="url(#footBg)"/>
  <rect x="0" y="0" width="1200" height="190" fill="url(#footGlow)"/>
  <path d="M 740 190 C 860 110, 1020 130, 1200 40 L 1200 190 Z" fill="url(#footWave)"/>
  <path d="M 0 42 Q 350 15 700 48 T 1200 32" fill="none" stroke="#60A5FA" stroke-opacity="0.2" stroke-width="1.5"/>

  <rect x="0" y="0" width="1200" height="3.5" fill="url(#footGrad)"/>
  <rect x="0" y="186.5" width="1200" height="3.5" fill="url(#footGrad)"/>

  <!-- Decorative Accent Pill -->
  <rect x="72" y="34" width="6" height="122" rx="3" fill="url(#footGrad)"/>

  <!-- Main Thank You Text -->
  <text x="96" y="76" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Thanks for Exploring!</text>

  <!-- Supporting Text -->
  <text x="96" y="108" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="700" fill="url(#footGrad)" letter-spacing="0.8">Python Bootcamp • Assessment 01</text>

  <!-- Tagline -->
  <text x="96" y="140" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1" letter-spacing="1.6">LEARNING BY BUILDING • IMPROVING THROUGH PRACTICE</text>

  <!-- Right Side Geometric Accent -->
  <g stroke="#A78BFA" stroke-opacity="0.3" stroke-width="1.3" fill="none">
    <rect x="960" y="52" width="66" height="66" rx="12" transform="rotate(15 993 85)"/>
    <rect x="1045" y="64" width="54" height="54" rx="10" stroke="#60A5FA" stroke-opacity="0.3" transform="rotate(-10 1072 91)"/>
  </g>
  <circle cx="993" cy="85" r="4" fill="#A78BFA"/>
  <circle cx="1072" cy="91" r="4" fill="#60A5FA"/>
</svg>
