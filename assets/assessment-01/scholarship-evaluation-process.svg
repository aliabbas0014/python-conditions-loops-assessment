<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" width="1160" height="440">

  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="softBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="softPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111318" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <style>
      .title-main { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111318; }
      .title-sub { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; letter-spacing: 0.4px; }
      .box-title { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #111318; }
      .box-text { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
      .box-code { font-family: 'Consolas', 'Fira Code', monospace; font-size: 11.5px; font-weight: 600; fill: #172554; }
      .label-badge { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .edge-label { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .footer-note { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
    </style>
  </defs>


  <rect x="0" y="0" width="1160" height="440" fill="#F8FAFC"/>
  <rect x="16" y="16" width="1128" height="408" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="16" y="16" width="1128" height="6" rx="3" fill="url(#headerGrad)"/>
  <rect x="36" y="34" width="126" height="24" rx="12" fill="url(#bpGrad)"/>
  <text x="99" y="50" text-anchor="middle" class="label-badge">TASK 01 • PROCESS FLOW</text>
  <text x="176" y="54" class="title-main">Scholarship Evaluation Process</text>
  <text x="36" y="77" class="title-sub">Step-by-step lifecycle from collecting student details to producing the final evaluation report</text>
  <line x1="36" y1="90" x2="1124" y2="90" stroke="#E2E8F0" stroke-width="1.5"/>


  <!-- 5 Horizontal Process Stages -->
  <!-- Stage 1 -->
  <rect x="44" y="128" width="194" height="225" rx="10" fill="url(#softBlueGrad)" stroke="#3B82F6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <circle cx="141" cy="158" r="18" fill="#3B82F6"/>
  <text x="141" y="163" text-anchor="middle" class="label-badge">1</text>
  <text x="141" y="198" text-anchor="middle" class="box-title">Collect Details</text>
  <text x="58" y="224" class="box-text">Prompt student for:</text>
  <text x="58" y="246" class="box-text">• Academic marks</text>
  <text x="58" y="268" class="box-text">• Attendance %</text>
  <text x="58" y="290" class="box-text">• Monthly income</text>
  <text x="141" y="330" text-anchor="middle" class="box-code">input() &amp; float()</text>

  <line x1="238" y1="240" x2="266" y2="240" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- Stage 2 -->
  <rect x="270" y="128" width="194" height="225" rx="10" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8" filter="url(#cardShadow)"/>
  <circle cx="367" cy="158" r="18" fill="#2563EB"/>
  <text x="367" y="163" text-anchor="middle" class="label-badge">2</text>
  <text x="367" y="198" text-anchor="middle" class="box-title">Validate Inputs</text>
  <text x="284" y="224" class="box-text">Verify valid bounds:</text>
  <text x="284" y="246" class="box-text">• 0 &lt;= marks &lt;= 100</text>
  <text x="284" y="268" class="box-text">• 0 &lt;= att. &lt;= 100</text>
  <text x="284" y="290" class="box-text">• income &gt;= 0</text>
  <text x="367" y="330" text-anchor="middle" class="box-code">Guard clauses</text>

  <line x1="464" y1="240" x2="492" y2="240" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- Stage 3 -->
  <rect x="496" y="128" width="194" height="225" rx="10" fill="url(#softPurpleGrad)" stroke="#8B5CF6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <circle cx="593" cy="158" r="18" fill="#7C3AED"/>
  <text x="593" y="163" text-anchor="middle" class="label-badge">3</text>
  <text x="593" y="198" text-anchor="middle" class="box-title">Check Criteria</text>
  <text x="510" y="224" class="box-text">Evaluate rules:</text>
  <text x="510" y="246" class="box-text">• Marks &gt;= 80%</text>
  <text x="510" y="268" class="box-text">• Attendance &gt;= 85%</text>
  <text x="510" y="290" class="box-text">• Income &lt;= 50,000</text>
  <text x="593" y="330" text-anchor="middle" class="box-code">Boolean conditions</text>

  <line x1="690" y1="240" x2="718" y2="240" stroke="#8B5CF6" stroke-width="2.2" marker-end="url(#arrowPurple)"/>

  <!-- Stage 4 -->
  <rect x="722" y="128" width="194" height="225" rx="10" fill="url(#softBlueGrad)" stroke="#3B82F6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <circle cx="819" cy="158" r="18" fill="#4F46E5"/>
  <text x="819" y="163" text-anchor="middle" class="label-badge">4</text>
  <text x="819" y="198" text-anchor="middle" class="box-title">Assign Status</text>
  <text x="736" y="224" class="box-text">Select outcome:</text>
  <text x="736" y="246" class="box-text">• &gt;= 90%: Full</text>
  <text x="736" y="268" class="box-text">• 80–89%: Partial</text>
  <text x="736" y="290" class="box-text">• Else: Ineligible</text>
  <text x="819" y="330" text-anchor="middle" class="box-code">if / elif / else</text>

  <line x1="916" y1="240" x2="944" y2="240" stroke="#8B5CF6" stroke-width="2.2" marker-end="url(#arrowPurple)"/>

  <!-- Stage 5 -->
  <rect x="948" y="128" width="168" height="225" rx="10" fill="url(#bpGrad)" filter="url(#cardShadow)"/>
  <circle cx="1032" cy="158" r="18" fill="#FFFFFF"/>
  <text x="1032" y="163" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" fill="#172554">5</text>
  <text x="1032" y="198" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Final Report</text>
  <text x="960" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#EFF6FF">Display complete</text>
  <text x="960" y="246" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#EFF6FF">evaluation card,</text>
  <text x="960" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#EFF6FF">award tier, or</text>
  <text x="960" y="290" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#EFF6FF">ineligible reason.</text>
  <text x="1032" y="330" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#FFFFFF">print() summary</text>


  <line x1="36" y1="402" x2="1124" y2="402" stroke="#E2E8F0" stroke-width="1"/>
  <text x="36" y="420" class="footer-note">Python Programming Assessment – Conditions &amp; Loops • Task 01 &amp; Task 02</text>
  <text x="1124" y="420" text-anchor="end" class="footer-note">aliabbas0014/python-conditions-loops-assessment</text>

</svg>
