  <text x="431" y="374" text-anchor="middle" class="box-text">Award or Ineligible Reason</text>

  <text x="305" y="424" text-anchor="middle" class="box-code">Focus: Conditional Branching (if / elif / else &amp; logical checks)</text>
  <text x="305" y="446" text-anchor="middle" class="box-text">Single-student evaluation per execution</text>

