<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 580" width="1140" height="580">

  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="softBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="softPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111318" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <style>
      .title-main { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111318; }
      .title-sub { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; letter-spacing: 0.4px; }
      .box-title { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #111318; }
      .box-text { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
      .box-code { font-family: 'Consolas', 'Fira Code', monospace; font-size: 11.5px; font-weight: 600; fill: #172554; }
      .label-badge { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.5px; }
      .edge-label { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .footer-note { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
    </style>
  </defs>


  <rect x="0" y="0" width="1140" height="580" fill="#F8FAFC"/>
  <rect x="16" y="16" width="1108" height="548" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="16" y="16" width="1108" height="6" rx="3" fill="url(#headerGrad)"/>
  <rect x="36" y="34" width="126" height="24" rx="12" fill="url(#bpGrad)"/>
  <text x="99" y="50" text-anchor="middle" class="label-badge">TASK 01 • DECISION LOGIC</text>
  <text x="176" y="54" class="title-main">Scholarship Eligibility Decision Rules</text>
  <text x="36" y="77" class="title-sub">Threshold gates for Marks, Attendance, and Monthly Family Income plus award tier classification</text>
  <line x1="36" y1="90" x2="1104" y2="90" stroke="#E2E8F0" stroke-width="1.5"/>


  <!-- Left Column: 3 Prerequisite Gates -->
  <text x="48" y="122" class="box-title">Step 1: Three Mandatory Eligibility Gates (All Must Pass)</text>

  <rect x="48" y="138" width="460" height="96" rx="10" fill="url(#softBlueGrad)" stroke="#3B82F6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="64" y="154" width="110" height="24" rx="6" fill="#3B82F6"/>
  <text x="119" y="170" text-anchor="middle" class="label-badge">GATE 1 • MARKS</text>
  <text x="188" y="172" class="box-title">Academic Marks &gt;= 80%</text>
  <text x="64" y="202" class="box-text">• Below 80% → Ineligible (insufficient academic marks)</text>
  <text x="64" y="222" class="box-text">• 80% to 89% → Partial tier | 90% and above → Full tier</text>

  <rect x="48" y="250" width="460" height="96" rx="10" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="64" y="266" width="136" height="24" rx="6" fill="#2563EB"/>
  <text x="132" y="282" text-anchor="middle" class="label-badge">GATE 2 • ATTENDANCE</text>
  <text x="212" y="284" class="box-title">Attendance &gt;= 85%</text>
  <text x="64" y="314" class="box-text">• Below 85% → Ineligible (attendance requirement not met)</text>
  <text x="64" y="334" class="box-text">• 85% or higher → Satisfies attendance condition</text>

  <rect x="48" y="362" width="460" height="96" rx="10" fill="url(#softPurpleGrad)" stroke="#8B5CF6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="64" y="378" width="122" height="24" rx="6" fill="#7C3AED"/>
  <text x="125" y="394" text-anchor="middle" class="label-badge">GATE 3 • INCOME</text>
  <text x="200" y="396" class="box-title">Monthly Income &lt;= Rs. 50,000</text>
  <text x="64" y="426" class="box-text">• Above Rs. 50,000 → Ineligible (exceeds income limit)</text>
  <text x="64" y="446" class="box-text">• Rs. 50,000 or less → Satisfies financial need condition</text>

  <!-- Connectors to Right Column -->
  <path d="M 508 186 L 560 186 L 560 245 L 612 245" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M 508 298 L 612 298" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M 508 410 L 560 410 L 560 350 L 612 350" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Right Column: Classification Outcomes -->
  <text x="616" y="122" class="box-title">Step 2: Scholarship Classification &amp; Outcome</text>

  <!-- Full Scholarship -->
  <rect x="616" y="138" width="476" height="114" rx="10" fill="url(#bpGrad)" filter="url(#cardShadow)"/>
  <text x="636" y="166" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">FULL SCHOLARSHIP AWARD</text>
  <text x="636" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#EFF6FF">Condition: Marks &gt;= 90%  AND  Attendance &gt;= 85%  AND  Income &lt;= Rs. 50,000</text>
  <text x="636" y="214" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#DBEAFE">Highest merit + need tier for top academic performers meeting all criteria.</text>
  <text x="636" y="236" font-family="'Consolas', monospace" font-size="11.5" fill="#FFFFFF">tier = "Full Scholarship"</text>

  <!-- Partial Scholarship -->
  <rect x="616" y="268" width="476" height="114" rx="10" fill="url(#softPurpleGrad)" stroke="#8B5CF6" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="636" y="296" class="box-title" fill="#4C1D95">PARTIAL SCHOLARSHIP AWARD</text>
  <text x="636" y="320" class="box-code">Condition: 80% &lt;= Marks &lt; 90%  AND  Attendance &gt;= 85%  AND  Income &lt;= Rs. 50,000</text>
  <text x="636" y="344" class="box-text">Qualifies for partial tuition assistance when marks fall between 80% and 89%.</text>
  <text x="636" y="366" class="box-code">tier = "Partial Scholarship"</text>

  <!-- Ineligible -->
  <rect x="616" y="398" width="476" height="114" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="636" y="426" class="box-title" fill="#991B1B">INELIGIBLE — REASON DISPLAYED</text>
  <text x="636" y="450" class="box-text">Triggered whenever Marks &lt; 80%, Attendance &lt; 85%, or Income &gt; Rs. 50,000.</text>
  <text x="636" y="474" class="box-text">Outputs explicit reason(s) explaining which threshold(s) were not satisfied.</text>
  <text x="636" y="496" class="box-code" fill="#991B1B">status = "Ineligible" + reason_list</text>


  <line x1="36" y1="542" x2="1104" y2="542" stroke="#E2E8F0" stroke-width="1"/>
  <text x="36" y="560" class="footer-note">Python Programming Assessment – Conditions &amp; Loops • Task 01 &amp; Task 02</text>
  <text x="1104" y="560" text-anchor="end" class="footer-note">aliabbas0014/python-conditions-loops-assessment</text>

</svg>
