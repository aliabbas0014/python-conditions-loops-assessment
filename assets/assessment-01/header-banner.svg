<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="55%" stop-color="#141928"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#111318" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="25%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#111318" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="280" fill="url(#bgDark)"/>
  <rect x="0" y="0" width="1200" height="280" fill="url(#glowBlue)"/>
  <rect x="0" y="0" width="1200" height="280" fill="url(#glowPurple)"/>

  <!-- Abstract Waves &amp; Geometric Accents -->
  <path d="M 680 0 C 820 80, 960 40, 1200 150 L 1200 280 L 620 280 C 710 200, 580 90, 680 0 Z" fill="url(#wave1)"/>
  <path d="M 790 280 C 910 180, 1040 210, 1200 110 L 1200 280 Z" fill="url(#wave2)"/>
  <path d="M 0 215 Q 300 165 600 220 T 1200 190" fill="none" stroke="#60A5FA" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M 0 238 Q 320 190 640 242 T 1200 212" fill="none" stroke="#A78BFA" stroke-opacity="0.20" stroke-width="1.5"/>

  <!-- Geometric Grid / Nodes on Right -->
  <g stroke="#60A5FA" stroke-opacity="0.25" stroke-width="1.2" fill="none">
    <polygon points="960,55 1015,85 1015,145 960,175 905,145 905,85"/>
    <polygon points="1065,95 1110,120 1110,170 1065,195 1020,170 1020,120" stroke="#A78BFA" stroke-opacity="0.28"/>
    <line x1="960" y1="55" x2="1065" y2="95"/>
    <line x1="1015" y1="145" x2="1020" y2="170"/>
  </g>
  <circle cx="960" cy="55" r="4" fill="#60A5FA"/>
  <circle cx="1015" cy="85" r="3.5" fill="#A78BFA"/>
  <circle cx="1065" cy="95" r="4.5" fill="#3B82F6"/>
  <circle cx="1110" cy="170" r="3.5" fill="#A78BFA"/>

  <!-- Top &amp; Bottom Accent Bars -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>
  <rect x="0" y="276" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Supporting Badge -->
  <rect x="72" y="42" width="235" height="28" rx="14" fill="#172554" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1"/>
  <text x="189.5" y="61" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#60A5FA" letter-spacing="1.6">BOOTCAMP ASSESSMENT 01</text>

  <!-- Main Heading -->
  <text x="72" y="124" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Python Programming</text>

  <!-- Subtitle with Gradient -->
  <text x="72" y="182" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#accentGrad)" letter-spacing="2.2">CONDITIONS &amp; LOOPS</text>

  <!-- Subtle Divider &amp; Metadata -->
  <line x1="72" y1="205" x2="540" y2="205" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="72" y="234" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="500" fill="#E2E8F0">Scholarship Eligibility System  •  Smart Pharmacy Inventory &amp; Sales System</text>
</svg>
